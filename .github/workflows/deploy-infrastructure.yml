name: Deploy Infrastructure

on:
  push:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'infrastructure/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging
          - dev

permissions:
  id-token: write   # Required for OIDC
  contents: read
  issues: write     # Required for manual approval action

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  detect-environment:
    name: Detect Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      domain: ${{ steps.detect.outputs.domain }}
      cloudfront-dist-id: ${{ steps.detect.outputs.cloudfront-dist-id }}
      cognito-domain: ${{ steps.detect.outputs.cognito-domain }}
    steps:
      - name: Detect environment from branch
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            case "${{ github.ref }}" in
              refs/heads/main)
                ENV="prod"
                ;;
              refs/heads/staging)
                ENV="staging"
                ;;
              refs/heads/develop)
                ENV="dev"
                ;;
              *)
                ENV="dev"
                ;;
            esac
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "🎯 Detected environment: $ENV"
          
          # Set domain based on environment
          case "$ENV" in
            prod)
              echo "domain=yourpace.cloud" >> $GITHUB_OUTPUT
              echo "cloudfront-dist-id=${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_PROD }}" >> $GITHUB_OUTPUT
              echo "cognito-domain=${{ secrets.COGNITO_AUTH_DOMAIN_PROD }}" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "domain=yourpace.cloud" >> $GITHUB_OUTPUT
              echo "cloudfront-dist-id=${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_STAGING }}" >> $GITHUB_OUTPUT
              echo "cognito-domain=${{ secrets.COGNITO_AUTH_DOMAIN_STAGING }}" >> $GITHUB_OUTPUT
              ;;
            dev)
              echo "domain=yourpace.cloud" >> $GITHUB_OUTPUT
              echo "cloudfront-dist-id=${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_DEV }}" >> $GITHUB_OUTPUT
              echo "cognito-domain=${{ secrets.COGNITO_AUTH_DOMAIN_DEV }}" >> $GITHUB_OUTPUT
              ;;
          esac

  deploy:
    name: Deploy CDK Stacks
    needs: detect-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-environment.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      # OIDC Authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Install infrastructure dependencies
        working-directory: infrastructure
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build infrastructure
        working-directory: infrastructure
        run: npm run build

      - name: Bootstrap CDK (us-east-1 for certificate)
        working-directory: infrastructure
        run: |
          npx cdk bootstrap aws://${{ env.AWS_ACCOUNT_ID }}/us-east-1 \
            --trust ${{ env.AWS_ACCOUNT_ID }} \
            --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess \
            2>/dev/null || true

      # ⚠️ DESTRUCTIVE CHANGE DETECTION
      - name: Check for destructive changes
        id: destructive-check
        working-directory: infrastructure
        env:
          ENVIRONMENT: ${{ needs.detect-environment.outputs.environment }}
          DOMAIN_NAME: ${{ needs.detect-environment.outputs.domain }}
        run: |
          echo "🔍 Checking for destructive changes in $ENVIRONMENT environment..."

          # Build CDK args with environment-specific context
          CDK_ARGS="-c account=${{ env.AWS_ACCOUNT_ID }}"
          CDK_ARGS="$CDK_ARGS -c env=$ENVIRONMENT"
          CDK_ARGS="$CDK_ARGS -c region=${{ env.AWS_REGION }}"
          CDK_ARGS="$CDK_ARGS -c domainName=$DOMAIN_NAME"
          CDK_ARGS="$CDK_ARGS -c hostedZoneId=${{ secrets.ROUTE53_HOSTED_ZONE_ID }}"
          CDK_ARGS="$CDK_ARGS -c cloudfrontCertificateArn=${{ secrets.CLOUDFRONT_CERTIFICATE_ARN }}"
          
          # Add Cognito custom domain ARN for production only
          if [ "$ENVIRONMENT" = "prod" ]; then
            CDK_ARGS="$CDK_ARGS -c cognitoCertificateArn=${{ secrets.COGNITO_CUSTOM_DOMAIN_ARN }}"
          fi

          DIFF_OUTPUT=$(npx cdk diff --all $CDK_ARGS 2>&1) || true
          echo "$DIFF_OUTPUT"

          if echo "$DIFF_OUTPUT" | grep -E "(will be destroyed|will be replaced|replacing)" > /dev/null; then
            echo ""
            echo "⚠️⚠️⚠️ WARNING: DESTRUCTIVE CHANGES DETECTED! ⚠️⚠️⚠️"
            echo "destructive=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No destructive changes detected"
            echo "destructive=false" >> $GITHUB_OUTPUT
          fi

      - name: Request approval for destructive changes
        if: steps.destructive-check.outputs.destructive == 'true'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: joe-glasgow
          minimum-approvals: 1
          issue-title: "⚠️ Destructive Infrastructure Changes Require Approval (${{ needs.detect-environment.outputs.environment }})"
          issue-body: |
            **Destructive changes were detected in the ${{ needs.detect-environment.outputs.environment }} environment!**

            These changes may require DNS updates after deployment.

            **To approve:** Comment "approved" on this issue
            **To reject:** Comment "denied" or close this issue

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          exclude-workflow-initiator-as-approver: false

      - name: Deploy CDK Stacks
        working-directory: infrastructure
        env:
          ENVIRONMENT: ${{ needs.detect-environment.outputs.environment }}
          DOMAIN_NAME: ${{ needs.detect-environment.outputs.domain }}
        run: |
          echo "🚀 Deploying CDK infrastructure ($ENVIRONMENT)..."

          # Build CDK args with environment-specific context
          CDK_ARGS="-c account=${{ env.AWS_ACCOUNT_ID }}"
          CDK_ARGS="$CDK_ARGS -c env=$ENVIRONMENT"
          CDK_ARGS="$CDK_ARGS -c region=${{ env.AWS_REGION }}"
          CDK_ARGS="$CDK_ARGS -c domainName=$DOMAIN_NAME"
          CDK_ARGS="$CDK_ARGS -c hostedZoneId=${{ secrets.ROUTE53_HOSTED_ZONE_ID }}"
          CDK_ARGS="$CDK_ARGS -c cloudfrontCertificateArn=${{ secrets.CLOUDFRONT_CERTIFICATE_ARN }}"
          
          # Add Cognito custom domain ARN for production only
          if [ "$ENVIRONMENT" = "prod" ]; then
            CDK_ARGS="$CDK_ARGS -c cognitoCertificateArn=${{ secrets.COGNITO_CUSTOM_DOMAIN_ARN }}"
            echo "✅ Production environment - Cognito custom domain enabled"
          else
            echo "ℹ️  $ENVIRONMENT environment - Using default Cognito domain"
          fi

          npx cdk deploy --all \
            --require-approval never \
            --ci \
            $CDK_ARGS

      - name: Verify deployment
        env:
          ENVIRONMENT: ${{ needs.detect-environment.outputs.environment }}
        run: |
          echo "✅ Verifying $ENVIRONMENT deployment..."
          
          case "$ENVIRONMENT" in
            prod)
              echo "Testing production domains..."
              curl -s -o /dev/null -w "✓ https://yourpace.cloud: HTTP %{http_code}\n" https://yourpace.cloud
              curl -s -o /dev/null -w "✓ https://www.yourpace.cloud: HTTP %{http_code}\n" https://www.yourpace.cloud
              curl -s -o /dev/null -w "✓ https://auth.yourpace.cloud/login: HTTP %{http_code}\n" https://auth.yourpace.cloud/login || echo "⚠️  auth.yourpace.cloud still provisioning"
              ;;
            staging)
              echo "Testing staging domain..."
              curl -s -o /dev/null -w "✓ https://staging.yourpace.cloud: HTTP %{http_code}\n" https://staging.yourpace.cloud
              ;;
            dev)
              echo "Testing dev domain..."
              curl -s -o /dev/null -w "✓ https://dev.yourpace.cloud: HTTP %{http_code}\n" https://dev.yourpace.cloud
              ;;
          esac

      - name: Deployment complete
        run: echo "✅ Infrastructure deployment to ${{ needs.detect-environment.outputs.environment }} complete!"

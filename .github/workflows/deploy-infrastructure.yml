name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC
  contents: read
  issues: write     # Required for manual approval action

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  deploy:
    name: Deploy CDK Stacks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      # OIDC Authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Install infrastructure dependencies
        working-directory: infrastructure
        run: npm ci

      - name: Build infrastructure
        working-directory: infrastructure
        run: npm run build

      - name: Bootstrap CDK (us-east-1 for certificate)
        working-directory: infrastructure
        run: |
          npx cdk bootstrap aws://${{ env.AWS_ACCOUNT_ID }}/us-east-1 \
            --trust ${{ env.AWS_ACCOUNT_ID }} \
            --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess \
            2>/dev/null || true

      # ⚠️ DESTRUCTIVE CHANGE DETECTION
      - name: Check for destructive changes
        id: destructive-check
        working-directory: infrastructure
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          echo "🔍 Checking for destructive changes..."

          # Build CDK args with all required context (including account for safety)
          CDK_ARGS="-c account=${{ env.AWS_ACCOUNT_ID }} -c env=prod -c domainName=$DOMAIN_NAME -c hostedZoneId=${{ secrets.HOSTED_ZONE_ID }}"

          DIFF_OUTPUT=$(npx cdk diff --all $CDK_ARGS 2>&1) || true
          echo "$DIFF_OUTPUT"

          if echo "$DIFF_OUTPUT" | grep -E "(will be destroyed|will be replaced|replacing)" > /dev/null; then
            echo ""
            echo "⚠️⚠️⚠️ WARNING: DESTRUCTIVE CHANGES DETECTED! ⚠️⚠️⚠️"
            echo "destructive=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No destructive changes detected"
            echo "destructive=false" >> $GITHUB_OUTPUT
          fi

      - name: Request approval for destructive changes
        if: steps.destructive-check.outputs.destructive == 'true'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: joe-glasgow
          minimum-approvals: 1
          issue-title: "⚠️ Destructive Infrastructure Changes Require Approval"
          issue-body: |
            **Destructive changes were detected in the CDK infrastructure!**

            These changes may require DNS updates after deployment.

            **To approve:** Comment "approved" on this issue
            **To reject:** Comment "denied" or close this issue

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          exclude-workflow-initiator-as-approver: false

      - name: Deploy CDK Stacks
        working-directory: infrastructure
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          echo "🚀 Deploying CDK infrastructure (PROD)..."

          # Build CDK args with all required context (including account for safety)
          CDK_ARGS="-c account=${{ env.AWS_ACCOUNT_ID }} -c env=prod -c domainName=$DOMAIN_NAME -c hostedZoneId=${{ secrets.HOSTED_ZONE_ID }}"

          npx cdk deploy --all \
            --require-approval never \
            --ci \
            $CDK_ARGS

      - name: Deployment complete
        run: echo "✅ Infrastructure deployment complete!"

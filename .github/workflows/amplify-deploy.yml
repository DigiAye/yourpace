name: Amplify Deploy

on:
  push:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'frontend/**'
      - 'amplify.yml'
      - '.github/workflows/amplify-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  detect-environment:
    name: Detect Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      amplify-branch: ${{ steps.detect.outputs.amplify-branch }}
    steps:
      - name: Detect environment from branch
        id: detect
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "📍 Git branch: $BRANCH"

          # Map git branch to environment and Amplify branch
          case "$BRANCH" in
            main)
              ENV="prod"
              AMPLIFY_BRANCH="main"
              ;;
            staging)
              ENV="staging"
              AMPLIFY_BRANCH="staging"
              ;;
            develop)
              ENV="dev"
              AMPLIFY_BRANCH="develop"
              ;;
            *)
              echo "⏭️ No Amplify deployment configured for branch: $BRANCH"
              exit 0
              ;;
          esac

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "amplify-branch=$AMPLIFY_BRANCH" >> $GITHUB_OUTPUT
          echo "🎯 Detected environment: $ENV (Amplify branch: $AMPLIFY_BRANCH)"

  trigger-amplify-build:
    name: Trigger Amplify Build
    needs: detect-environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-amplify-${{ github.run_id }}

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Create frontend environment file for Amplify build
        working-directory: frontend
        env:
          NEXT_PUBLIC_COGNITO_REGION: eu-west-1
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_USER_POOL_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ secrets.COGNITO_AUTH_DOMAIN_PROD }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.NEXT_PUBLIC_CLOUDFRONT_DISTRIBUTION_ID }}
          NEXT_PUBLIC_AWS_REGION: ${{ secrets.NEXT_PUBLIC_AWS_REGION }}
          NEXT_PUBLIC_AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          NEXT_PUBLIC_USERS_TABLE: ${{ secrets.NEXT_PUBLIC_USERS_TABLE }}
          NEXT_PUBLIC_WORKOUTS_TABLE: ${{ secrets.NEXT_PUBLIC_WORKOUTS_TABLE }}
          NEXT_PUBLIC_EXERCISES_TABLE: ${{ secrets.NEXT_PUBLIC_EXERCISES_TABLE }}
          NEXT_PUBLIC_GOALS_TABLE: ${{ secrets.NEXT_PUBLIC_GOALS_TABLE }}
          NEXT_PUBLIC_ASSETS_BUCKET: ${{ secrets.NEXT_PUBLIC_ASSETS_BUCKET }}
          NEXT_PUBLIC_FRONTEND_BUCKET: ${{ secrets.NEXT_PUBLIC_FRONTEND_BUCKET }}
          NEXT_PUBLIC_VPC_ID: ${{ secrets.NEXT_PUBLIC_VPC_ID }}
          NEXT_PUBLIC_LAMBDA_SECURITY_GROUP_ID: ${{ secrets.NEXT_PUBLIC_LAMBDA_SECURITY_GROUP_ID }}
          NEXT_PUBLIC_HOSTED_ZONE_ID: ${{ secrets.NEXT_PUBLIC_HOSTED_ZONE_ID }}
          NEXT_PUBLIC_CLOUDFRONT_DOMAIN: ${{ secrets.NEXT_PUBLIC_CLOUDFRONT_DOMAIN }}
        run: |
          cat > .env.local << 'EOF'
          NEXT_PUBLIC_COGNITO_REGION=${{ env.NEXT_PUBLIC_COGNITO_REGION }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID=${{ env.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_DOMAIN=${{ env.NEXT_PUBLIC_COGNITO_DOMAIN }}
          NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CLOUDFRONT_DISTRIBUTION_ID=${{ env.NEXT_PUBLIC_CLOUDFRONT_DISTRIBUTION_ID }}
          NEXT_PUBLIC_AWS_REGION=${{ env.NEXT_PUBLIC_AWS_REGION }}
          NEXT_PUBLIC_AWS_ACCOUNT_ID=${{ env.NEXT_PUBLIC_AWS_ACCOUNT_ID }}
          NEXT_PUBLIC_USERS_TABLE=${{ env.NEXT_PUBLIC_USERS_TABLE }}
          NEXT_PUBLIC_WORKOUTS_TABLE=${{ env.NEXT_PUBLIC_WORKOUTS_TABLE }}
          NEXT_PUBLIC_EXERCISES_TABLE=${{ env.NEXT_PUBLIC_EXERCISES_TABLE }}
          NEXT_PUBLIC_GOALS_TABLE=${{ env.NEXT_PUBLIC_GOALS_TABLE }}
          NEXT_PUBLIC_ASSETS_BUCKET=${{ env.NEXT_PUBLIC_ASSETS_BUCKET }}
          NEXT_PUBLIC_FRONTEND_BUCKET=${{ env.NEXT_PUBLIC_FRONTEND_BUCKET }}
          NEXT_PUBLIC_VPC_ID=${{ env.NEXT_PUBLIC_VPC_ID }}
          NEXT_PUBLIC_LAMBDA_SECURITY_GROUP_ID=${{ env.NEXT_PUBLIC_LAMBDA_SECURITY_GROUP_ID }}
          NEXT_PUBLIC_HOSTED_ZONE_ID=${{ env.NEXT_PUBLIC_HOSTED_ZONE_ID }}
          NEXT_PUBLIC_CLOUDFRONT_DOMAIN=${{ env.NEXT_PUBLIC_CLOUDFRONT_DOMAIN }}
          EOF
          echo "✅ Created .env.local for Amplify build"

      - name: Trigger Amplify build
        env:
          ENVIRONMENT: ${{ needs.detect-environment.outputs.environment }}
          AMPLIFY_BRANCH: ${{ needs.detect-environment.outputs.amplify-branch }}
          AMPLIFY_APP_ID_MAIN: ${{ secrets.AMPLIFY_APP_ID_MAIN }}
          AMPLIFY_APP_ID_STAGING: ${{ secrets.AMPLIFY_APP_ID_STAGING }}
          AMPLIFY_APP_ID_DEVELOP: ${{ secrets.AMPLIFY_APP_ID_DEVELOP }}
        run: |
          # Select the correct AMPLIFY_APP_ID based on environment
          case "$ENVIRONMENT" in
            prod)
              AMPLIFY_APP_ID="$AMPLIFY_APP_ID_MAIN"
              ;;
            staging)
              AMPLIFY_APP_ID="$AMPLIFY_APP_ID_STAGING"
              ;;
            dev)
              AMPLIFY_APP_ID="$AMPLIFY_APP_ID_DEVELOP"
              ;;
            *)
              echo "❌ Unknown environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

          if [ -z "$AMPLIFY_APP_ID" ]; then
            echo "❌ AMPLIFY_APP_ID secret not configured for environment: $ENVIRONMENT"
            exit 1
          fi

          echo "🚀 Triggering Amplify build for branch: $AMPLIFY_BRANCH ($ENVIRONMENT environment)"
          echo "   App ID: $AMPLIFY_APP_ID"

          # Start a new Amplify build job
          JOB_ID=$(aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE \
            --region "$AWS_REGION" \
            --query 'jobSummary.jobId' \
            --output text 2>&1)

          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "None" ]; then
            echo "❌ Failed to start Amplify build job"
            echo ""
            echo "Possible causes:"
            echo "  1. Amplify app does not exist (App ID: $AMPLIFY_APP_ID)"
            echo "  2. Branch '$AMPLIFY_BRANCH' is not connected to the app"
            echo "  3. AWS credentials don't have permission to trigger builds"
            echo ""
            echo "To fix:"
            echo "  1. Create the Amplify app in AWS Console"
            echo "  2. Connect the branch to the app"
            echo "  3. Update the AMPLIFY_APP_ID_* secrets with the correct app ID"
            exit 1
          fi

          echo "✅ Amplify build triggered successfully"
          echo "   Job ID: $JOB_ID"
          echo "   Branch: $AMPLIFY_BRANCH"
          echo "   Environment: $ENVIRONMENT"
          echo ""
          echo "📊 View build progress:"
          echo "   https://eu-west-1.console.aws.amazon.com/amplify/home?region=eu-west-1#/$AMPLIFY_APP_ID/branches/$AMPLIFY_BRANCH/jobs/$JOB_ID"

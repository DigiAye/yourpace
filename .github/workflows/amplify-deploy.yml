name: Amplify Deploy

on:
  push:
    branches:
      - main
      - staging
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  build-and-deploy:
    name: Build and Deploy to Amplify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-amplify-${{ github.run_id }}

      - name: Deploy to Amplify
        env:
          AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
        run: |
          # Determine which branch we're deploying
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "🚀 Deploying to Amplify for branch: $BRANCH"

          # Validate branch
          if [[ ! "$BRANCH" =~ ^(main|staging|develop)$ ]]; then
            echo "⏭️ No Amplify deployment configured for branch: $BRANCH"
            exit 0
          fi

          if [ -z "$AMPLIFY_APP_ID" ]; then
            echo "❌ AMPLIFY_APP_ID secret not configured"
            exit 1
          fi

          # Create a deployment using the built artifacts
          echo "📦 Creating Amplify deployment for branch: $BRANCH"

          # Start a new job by creating/updating the branch
          aws amplify create-branch \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$BRANCH" \
            --region "$AWS_REGION" 2>/dev/null || true

          echo "✅ Amplify deployment initiated for branch: $BRANCH"

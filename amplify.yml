version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      env:
        variables:
          # Cognito Configuration - Required for OIDC authentication
          NEXT_PUBLIC_COGNITO_REGION: $COGNITO_REGION
          NEXT_PUBLIC_COGNITO_CLIENT_ID: $COGNITO_USER_POOL_CLIENT_ID
          # Frontend Configuration
          NEXT_PUBLIC_APP_URL: $APP_URL
          # AWS Configuration
          NEXT_PUBLIC_AWS_REGION: $AWS_REGION
          NEXT_PUBLIC_AWS_ACCOUNT_ID: $AWS_ACCOUNT_ID
          # DynamoDB Tables
          NEXT_PUBLIC_USERS_TABLE: $DYNAMODB_USERS_TABLE
          NEXT_PUBLIC_WORKOUTS_TABLE: $DYNAMODB_WORKOUTS_TABLE
          NEXT_PUBLIC_EXERCISES_TABLE: $DYNAMODB_EXERCISES_TABLE
          NEXT_PUBLIC_GOALS_TABLE: $DYNAMODB_GOALS_TABLE
          # S3 Buckets
          NEXT_PUBLIC_ASSETS_BUCKET: $S3_ASSETS_BUCKET
          NEXT_PUBLIC_FRONTEND_BUCKET: $S3_FRONTEND_BUCKET
          # VPC Configuration
          NEXT_PUBLIC_VPC_ID: $VPC_ID
          NEXT_PUBLIC_LAMBDA_SECURITY_GROUP_ID: $LAMBDA_SECURITY_GROUP_ID
          # Route53 Configuration
          NEXT_PUBLIC_HOSTED_ZONE_ID: $HOSTED_ZONE_ID
        branches:
          main:
            variables:
              NEXT_PUBLIC_COGNITO_DOMAIN: $COGNITO_AUTH_DOMAIN_PROD
              NEXT_PUBLIC_CLOUDFRONT_DISTRIBUTION_ID: $AWS_CLOUDFRONT_DISTRIBUTION_ID_PROD
              NEXT_PUBLIC_CLOUDFRONT_DOMAIN: $NEXT_PUBLIC_CLOUDFRONT_DOMAIN
          staging:
            variables:
              NEXT_PUBLIC_COGNITO_DOMAIN: $COGNITO_AUTH_DOMAIN_STAGING
              NEXT_PUBLIC_CLOUDFRONT_DISTRIBUTION_ID: $AWS_CLOUDFRONT_DISTRIBUTION_ID_STAGING
          develop:
            variables:
              NEXT_PUBLIC_COGNITO_DOMAIN: $COGNITO_AUTH_DOMAIN_DEV
              NEXT_PUBLIC_CLOUDFRONT_DISTRIBUTION_ID: $AWS_CLOUDFRONT_DISTRIBUTION_ID_DEV

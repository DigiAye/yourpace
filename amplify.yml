version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - echo "Setting up environment variables..."
            - export NEXT_PUBLIC_COGNITO_REGION="${COGNITO_REGION}"
            - export NEXT_PUBLIC_COGNITO_CLIENT_ID="${COGNITO_USER_POOL_CLIENT_ID}"
            - export NEXT_PUBLIC_COGNITO_DOMAIN="${COGNITO_AUTH_DOMAIN}"
            - export NEXT_PUBLIC_APP_URL="${APP_URL}"
            - export NEXT_PUBLIC_AWS_REGION="${AWS_REGION}"
            - export NEXT_PUBLIC_AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID}"
            - export NEXT_PUBLIC_USERS_TABLE="${DYNAMODB_USERS_TABLE}"
            - export NEXT_PUBLIC_WORKOUTS_TABLE="${DYNAMODB_WORKOUTS_TABLE}"
            - export NEXT_PUBLIC_EXERCISES_TABLE="${DYNAMODB_EXERCISES_TABLE}"
            - export NEXT_PUBLIC_GOALS_TABLE="${DYNAMODB_GOALS_TABLE}"
            - export NEXT_PUBLIC_ASSETS_BUCKET="${S3_ASSETS_BUCKET}"
            - export NEXT_PUBLIC_FRONTEND_BUCKET="${S3_FRONTEND_BUCKET}"
            - export NEXT_PUBLIC_VPC_ID="${VPC_ID}"
            - export NEXT_PUBLIC_LAMBDA_SECURITY_GROUP_ID="${LAMBDA_SECURITY_GROUP_ID}"
            - export NEXT_PUBLIC_HOSTED_ZONE_ID="${HOSTED_ZONE_ID}"
            - export NEXT_PUBLIC_CLOUDFRONT_DISTRIBUTION_ID="${AWS_CLOUDFRONT_DISTRIBUTION_ID}"
            - export NEXT_PUBLIC_CLOUDFRONT_DOMAIN="${NEXT_PUBLIC_CLOUDFRONT_DOMAIN}"
            - echo "✅ Environment variables configured"
            - |
              cat > .env.production << EOF
              NEXT_PUBLIC_COGNITO_REGION=${COGNITO_REGION}
              NEXT_PUBLIC_COGNITO_CLIENT_ID=${COGNITO_USER_POOL_CLIENT_ID}
              NEXT_PUBLIC_COGNITO_DOMAIN=${COGNITO_AUTH_DOMAIN}
              NEXT_PUBLIC_APP_URL=${APP_URL}
              NEXT_PUBLIC_AWS_REGION=${AWS_REGION}
              NEXT_PUBLIC_AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}
              NEXT_PUBLIC_USERS_TABLE=${DYNAMODB_USERS_TABLE}
              NEXT_PUBLIC_WORKOUTS_TABLE=${DYNAMODB_WORKOUTS_TABLE}
              NEXT_PUBLIC_EXERCISES_TABLE=${DYNAMODB_EXERCISES_TABLE}
              NEXT_PUBLIC_GOALS_TABLE=${DYNAMODB_GOALS_TABLE}
              NEXT_PUBLIC_ASSETS_BUCKET=${S3_ASSETS_BUCKET}
              NEXT_PUBLIC_FRONTEND_BUCKET=${S3_FRONTEND_BUCKET}
              NEXT_PUBLIC_VPC_ID=${VPC_ID}
              NEXT_PUBLIC_LAMBDA_SECURITY_GROUP_ID=${LAMBDA_SECURITY_GROUP_ID}
              NEXT_PUBLIC_HOSTED_ZONE_ID=${HOSTED_ZONE_ID}
              NEXT_PUBLIC_CLOUDFRONT_DISTRIBUTION_ID=${AWS_CLOUDFRONT_DISTRIBUTION_ID}
              NEXT_PUBLIC_CLOUDFRONT_DOMAIN=${NEXT_PUBLIC_CLOUDFRONT_DOMAIN}
              EOF
            - echo "✅ .env.production file created"
            - npm run build
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
